<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    {% include header.html %}

    <div class="hero">
      <div class="hero__bg">
        <video loop muted autoplay playsinline poster="/images/bg.jpg" class="hero__video">
          <source src="/images/bg.mp4" type="video/mp4">
        </video>
      </div>
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1 class="hero__title">{{ site.title }}</h1>
        <p class="hero__subtitle">{{ site.description }}</p>
      </div>
    </div>

    <main class="page-content" id="main-content">
      <div class="wrap">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}
  </body>
</html>
