<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/xmas2015.css' | relative_url }}">
    <style>
      .wrap p { margin: 2rem auto; }
      .flickr-embed-frame { padding: 0.5rem !important; float: left; }
      .right > .flickr-embed-frame { float: right; }
      .no-float > .flickr-embed-frame { float: none; }
    </style>
  </head>
  <body>
    {% include header.html %}

    <div class="hero">
      <div class="hero__bg">
        <video loop muted autoplay playsinline poster="/images/bg.jpg" class="hero__video">
          <source src="/images/xmas2015/xmas2015.mp4" type="video/mp4">
        </video>
      </div>
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1 class="hero__title">&#10052; Happy Holidays 2015</h1>
      </div>
    </div>

    <main class="page-content" id="main-content">
      <div class="wrap">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}
  </body>
</html>
